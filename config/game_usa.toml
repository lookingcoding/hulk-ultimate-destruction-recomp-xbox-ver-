# Recompiler input for the North American default.xbe (USA, Asia), written by xbe_symbols. Hand-found entries
# carry the European address they were matched from (config/game.toml)

[xbe]
path = "assets/usa/default.xbe"
title = 0x56550039
entry = 0x20A016
xdk = 5849
out = "generated/game_usa"
partitions = 128
code_sections = [".text", "BINK", "BINK32", "BINK32A", "BINK16", "BINK4444", "BINK5551", "BINKYUY2", "BINK16MX", "BINK16X2", "BINK16M", "BINK32MX", "BINK32X2", "BINK32M", "D3D", "XGRPH", "DSOUND", "XPP"]
library = "HulkRecompiledUSA.dll"  # <exe>.dll, which the executable delay loads
data_ranges = [[0x346AFC, 0x346B04]] # "20XC00\0\0" signature preceding _except_handler3 (EU 0x3423EC)

# extra entry points
[functions]
0x346B04 = "" # _except_handler3 (EU 0x3423F4)
0x353B95 = "" # thread notification callback (EU 0x34F465)
0x353C19 = "" # SEH filter after the noreturn _endthreadex call (EU 0x34F4E9)

[[function]]
at = 0x353BBF # EU 0x34F48F
end = 0x353C19

